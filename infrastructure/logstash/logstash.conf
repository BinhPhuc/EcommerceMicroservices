input {
  tcp {
    port => 5000
    codec => json_lines
  }
  udp {
    port => 5000
    codec => json_lines
  }
}

output {
  if [app_name] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "%{app_name}-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "unknown-%{+YYYY.MM.dd}"
    }
  }
  stdout {
    codec => rubydebug
  }
}
