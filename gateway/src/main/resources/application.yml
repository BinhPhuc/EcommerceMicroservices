server:
  port: 8085

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/v1/products/**, /api/v1/categories/**
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**
            - id: flash-sale-service
              uri: lb://flash-sale-service
              predicates:
                - Path=/api/v1/flash-sales/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{useridkeyresolver}"
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.boot: 20

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000

      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: -1ms

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8086/realms/ecom-realm
          jwk-set-uri: http://localhost:8086/realms/ecom-realm/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
